# Local development cluster. Node image pinned by digest so every machine gets the same
# Kubernetes build. One control plane and one worker keeps it light on a laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: camp
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
